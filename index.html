<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>English Master | آموزش زبان انگلیسی</title>

<meta name="description"
content="آموزش زبان انگلیسی از سطح A1 با درس، لغات، مکالمه و آزمون">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

:root{
    --bg:#f5f7fb;
    --card:#ffffff;
    --text:#172033;
    --muted:#718096;
    --primary:#5b5bf7;
    --primary2:#7c5cff;
    --border:#e5e7eb;
    --success:#16a34a;
    --danger:#ef4444;
    --shadow:0 8px 30px rgba(0,0,0,.07);
}

body.dark{
    --bg:#0f1117;
    --card:#181b24;
    --text:#f5f7fb;
    --muted:#9ca3af;
    --border:#292d38;
    --shadow:0 8px 30px rgba(0,0,0,.25);
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    transition:.25s;
}

button{
    border:0;
    cursor:pointer;
}

.app{
    max-width:1100px;
    margin:auto;
    padding-bottom:90px;
}

/* HEADER */

.header{
    position:sticky;
    top:0;
    z-index:50;
    background:var(--bg);
    border-bottom:1px solid var(--border);
    padding:15px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-icon{
    width:42px;
    height:42px;
    border-radius:13px;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:20px;
    font-weight:bold;
}

.logo h1{
    font-size:18px;
}

.logo small{
    display:block;
    color:var(--muted);
    margin-top:3px;
}

.icon-btn{
    width:42px;
    height:42px;
    border-radius:12px;
    background:var(--card);
    color:var(--text);
    border:1px solid var(--border);
    font-size:19px;
}

/* MAIN */

main{
    padding:20px;
}

.section-title{
    margin-bottom:15px;
}

.section-title h2{
    font-size:23px;
}

.section-title p{
    color:var(--muted);
    margin-top:6px;
}

/* HERO */

.hero{
    background:linear-gradient(135deg,#5b5bf7,#8b5cf6);
    border-radius:25px;
    color:white;
    padding:28px;
    margin-bottom:25px;
    box-shadow:0 15px 40px rgba(91,91,247,.25);
}

.hero h2{
    font-size:27px;
    margin-bottom:10px;
}

.hero p{
    line-height:1.9;
    opacity:.92;
}

.hero-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;
}

.btn{
    padding:13px 20px;
    border-radius:13px;
    font-size:14px;
    font-weight:bold;
}

.btn-primary{
    background:white;
    color:#5146e5;
}

.btn-dark{
    background:rgba(0,0,0,.18);
    color:white;
}

/* PROGRESS */

.progress-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
    margin-bottom:25px;
    box-shadow:var(--shadow);
}

.progress-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:12px;
}

.progress-top span:last-child{
    color:var(--primary);
    font-weight:bold;
}

.progress-bar{
    width:100%;
    height:11px;
    background:var(--border);
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    width:0;
    background:linear-gradient(90deg,var(--primary),var(--primary2));
    border-radius:20px;
    transition:.4s;
}

/* LEVELS */

.level-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.level-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
    cursor:pointer;
    transition:.2s;
    box-shadow:var(--shadow);
}

.level-card:hover{
    transform:translateY(-3px);
}

.level-icon{
    width:48px;
    height:48px;
    border-radius:15px;
    background:rgba(91,91,247,.12);
    color:var(--primary);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    margin-bottom:15px;
}

.level-card h3{
    margin-bottom:7px;
}

.level-card p{
    color:var(--muted);
    font-size:13px;
    line-height:1.8;
}

.locked{
    opacity:.6;
}

.lock{
    float:left;
}

/* LESSONS */

.lesson-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.lesson-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:19px;
    padding:18px;
    box-shadow:var(--shadow);
    cursor:pointer;
    transition:.2s;
}

.lesson-card:hover{
    transform:translateY(-3px);
}

.lesson-number{
    color:var(--primary);
    font-size:13px;
    font-weight:bold;
    margin-bottom:8px;
}

.lesson-card h3{
    font-size:17px;
    margin-bottom:12px;
}

.lesson-info{
    display:flex;
    justify-content:space-between;
    color:var(--muted);
    font-size:12px;
}

.stars{
    color:#f59e0b;
    letter-spacing:2px;
}

.completed{
    border-color:rgba(22,163,74,.45);
}

.lesson-locked{
    opacity:.5;
    cursor:not-allowed;
}

/* LESSON PAGE */

.back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 15px;
    border-radius:12px;
    margin-bottom:20px;
}

.lesson-header{
    background:linear-gradient(135deg,#5b5bf7,#8b5cf6);
    color:white;
    border-radius:23px;
    padding:25px;
    margin-bottom:20px;
}

.lesson-header small{
    opacity:.8;
}

.lesson-header h2{
    margin-top:8px;
}

.content-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:var(--shadow);
}

.content-card h3{
    margin-bottom:16px;
}

.vocab-item{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:14px 0;
    border-bottom:1px solid var(--border);
}

.vocab-item:last-child{
    border-bottom:0;
}

.vocab-en{
    direction:ltr;
    text-align:left;
    font-weight:bold;
}

.vocab-fa{
    color:var(--muted);
}

.conversation{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.message{
    max-width:85%;
    padding:13px 16px;
    border-radius:16px;
    line-height:1.8;
}

.message.a{
    align-self:flex-start;
    background:rgba(91,91,247,.12);
}

.message.b{
    align-self:flex-end;
    background:rgba(22,163,74,.12);
}

.message-speaker{
    font-size:11px;
    color:var(--primary);
    font-weight:bold;
    margin-bottom:4px;
}

.message-en{
    direction:ltr;
    text-align:left;
}

.message-fa{
    color:var(--muted);
    margin-top:5px;
    font-size:13px;
}

.complete-btn{
    width:100%;
    padding:16px;
    border-radius:16px;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:white;
    font-size:16px;
    font-weight:bold;
}

/* EXAM */

.exam-question{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
    margin-bottom:15px;
}

.exam-question h3{
    margin-bottom:15px;
    font-size:16px;
}

.options{
    display:grid;
    gap:10px;
}

.option{
    padding:13px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    border-radius:12px;
    text-align:right;
}

.option.selected{
    border-color:var(--primary);
    background:rgba(91,91,247,.1);
}

.submit-exam{
    width:100%;
    padding:16px;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:white;
    border-radius:15px;
    font-size:16px;
    font-weight:bold;
}

/* SETTINGS */

.setting-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px;
    margin-bottom:12px;
}

.setting-item p{
    color:var(--muted);
    margin-top:5px;
    font-size:12px;
}

.toggle{
    width:52px;
    height:29px;
    background:var(--border);
    border-radius:30px;
    position:relative;
}

.toggle::after{
    content:"";
    position:absolute;
    width:23px;
    height:23px;
    background:white;
    border-radius:50%;
    top:3px;
    right:3px;
    transition:.2s;
}

body.dark .toggle{
    background:var(--primary);
}

body.dark .toggle::after{
    right:26px;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:min(100%,1100px);
    background:var(--card);
    border-top:1px solid var(--border);
    display:grid;
    grid-template-columns:repeat(3,1fr);
    z-index:100;
}

.nav-btn{
    background:none;
    color:var(--muted);
    padding:13px 5px;
    font-size:12px;
}

.nav-btn.active{
    color:var(--primary);
    font-weight:bold;
}

.nav-icon{
    display:block;
    font-size:19px;
    margin-bottom:3px;
}

/* MESSAGE */

.toast{
    position:fixed;
    top:80px;
    left:50%;
    transform:translateX(-50%) translateY(-20px);
    background:var(--card);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    border-radius:15px;
    padding:15px 20px;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:200;
    min-width:250px;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* LOADING */

.loading{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
}

.spinner{
    width:40px;
    height:40px;
    border:4px solid var(--border);
    border-top-color:var(--primary);
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 15px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* EMPTY */

.empty{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:35px;
    text-align:center;
    color:var(--muted);
}

/* RESPONSIVE */

@media(max-width:850px){

    .level-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .lesson-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:550px){

    main{
        padding:14px;
    }

    .header{
        padding:12px 14px;
    }

    .hero{
        padding:22px;
    }

    .hero h2{
        font-size:22px;
    }

    .level-grid,
    .lesson-grid{
        grid-template-columns:1fr;
    }

    .message{
        max-width:94%;
    }

}

</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">

        <div class="logo-icon">
            EN
        </div>

        <div>
            <h1>English Master</h1>
            <small>یادگیری زبان انگلیسی</small>
        </div>

    </div>

    <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">
        🌙
    </button>

</header>

<main id="app">

    <div class="loading">

        <div class="spinner"></div>

        <p>
            در حال بارگذاری درس‌ها...
        </p>

    </div>

</main>

<nav class="bottom-nav">

    <button class="nav-btn active" onclick="showHome()" id="navHome">
        <span class="nav-icon">🏠</span>
        خانه
    </button>

    <button class="nav-btn" onclick="showLevels()" id="navLessons">
        <span class="nav-icon">📚</span>
        درس‌ها
    </button>

    <button class="nav-btn" onclick="showSettings()" id="navSettings">
        <span class="nav-icon">⚙️</span>
        تنظیمات
    </button>

</nav>

</div>

<div class="toast" id="toast"></div>


<script>

/* =====================================================
   VARIABLES
===================================================== */

let lessons = {};

let progress = JSON.parse(
    localStorage.getItem("english_master_progress_v1") || "{}"
);

let currentLesson = null;

let examAnswers = {};

let examQuestions = [];


/* =====================================================
   SAVE PROGRESS
===================================================== */

function saveProgress(){

    localStorage.setItem(
        "english_master_progress_v1",
        JSON.stringify(progress)
    );

}


/* =====================================================
   THEME
===================================================== */

function loadTheme(){

    const theme =
        localStorage.getItem("english_master_theme");

    if(theme === "dark"){

        document.body.classList.add("dark");

        document.getElementById("themeBtn").textContent = "☀️";

    }

}


function toggleTheme(){

    document.body.classList.toggle("dark");

    const dark =
        document.body.classList.contains("dark");

    localStorage.setItem(
        "english_master_theme",
        dark ? "dark" : "light"
    );

    document.getElementById("themeBtn").textContent =
        dark ? "☀️" : "🌙";

}


/* =====================================================
   TOAST
===================================================== */

function showMessage(title,text){

    const toast =
        document.getElementById("toast");

    toast.innerHTML =
        `<strong>${escapeHTML(title)}</strong>
         <br>
         <small>${escapeHTML(text)}</small>`;

    toast.classList.add("show");

    setTimeout(()=>{

        toast.classList.remove("show");

    },1800);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    if(value === undefined || value === null)
        return "";

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =====================================================
   PARSE TXT FILE
===================================================== */

function parseLessons(text){

    const result = {};

    /*
      هر درس با این ساختار شروع می‌شود:

      === درس 1 (A1) ===
    */

    const sections = text.split(
        /(?=^===\s*درس\s+\d+\s*\([^)]+\)\s*===)/gm
    );

    for(const section of sections){

        const header = section.match(
            /^===\s*درس\s+(\d+)\s*\(([^)]+)\)\s*===/m
        );

        if(!header)
            continue;

        const id =
            Number(header[1]);

        const level =
            header[2].trim();

        const body =
            section
            .slice(header[0].length)
            .trim();


        /* =========================
           VOCABULARY
        ========================= */

        const vocab = [];

        const vocabMatch = body.match(
            /معنی‌ها:\s*([\s\S]*?)(?=\n\s*مکالمه:|\n={5,}|$)/
        );

        if(vocabMatch){

            const lines =
                vocabMatch[1].split(/\r?\n/);

            for(const line of lines){

                const match =
                    line.match(
                        /^\s*\d+\.\s*(.*?)\s*=\s*(.*?)\s*$/
                    );

                if(match){

                    vocab.push({

                        en:match[1].trim(),

                        fa:match[2].trim()

                    });

                }

            }

        }


        /* =========================
           CONVERSATION
        ========================= */

        const conversation = [];

        const conversationMatch =
            body.match(
                /مکالمه:\s*([\s\S]*?)(?=\n={5,}|$)/
            );

        if(conversationMatch){

            const conversationText =
                conversationMatch[1].trim();

            const lines =
                conversationText.split(/\r?\n/);

            for(const line of lines){

                const match =
                    line.match(
                        /^\s*([A-Z])\s*:\s*(.+?)\s*$/
                    );

                if(match){

                    conversation.push({

                        speaker:
                            match[1].trim(),

                        en:
                            match[2].trim()

                    });

                }

            }

        }


        result[id] = {

            id:id,

            level:level,

            title:"درس " + id,

            vocab:vocab,

            conversation:conversation

        };

    }

    return result;

}


/* =====================================================
   LOAD TXT FILES
===================================================== */

async function loadEnglishData(){

    try{

        const responses =
            await Promise.all([

                fetch("./A.txt"),

                fetch("./Aplus.txt")

            ]);


        if(!responses[0].ok){

            throw new Error(
                "A.txt پیدا نشد"
            );

        }


        if(!responses[1].ok){

            throw new Error(
                "Aplus.txt پیدا نشد"
            );

        }


        const a1Text =
            await responses[0].text();

        const aPlusText =
            await responses[1].text();


        const a1Lessons =
            parseLessons(a1Text);

        const aPlusLessons =
            parseLessons(aPlusText);


        lessons = {

            ...a1Lessons,

            ...aPlusLessons

        };


        console.log(
            "English Master loaded:",
            Object.keys(lessons).length,
            "lessons"
        );


        showHome();

    }

    catch(error){

        console.error(error);

        document.getElementById("app").innerHTML = `

            <div class="empty">

                <h2>❌ خطا در بارگذاری</h2>

                <p style="margin-top:12px">
                    ${escapeHTML(error.message)}
                </p>

                <p style="margin-top:12px">
                    مطمئن شوید فایل‌های
                    <b>A.txt</b>
                    و
                    <b>Aplus.txt</b>
                    کنار index.html قرار دارند.
                </p>

            </div>

        `;

    }

}


/* =====================================================
   TOTAL LESSONS
===================================================== */

function getLessonIds(){

    return Object.keys(lessons)
        .map(Number)
        .sort((a,b)=>a-b);

}


function getTotalLessons(){

    return getLessonIds().length;

}


function getCompletedCount(){

    return getLessonIds()
        .filter(id =>
            progress[id] &&
            progress[id].completed
        )
        .length;

}


function getProgressPercent(){

    const total =
        getTotalLessons();

    if(!total)
        return 0;

    return Math.round(
        getCompletedCount() /
        total *
        100
    );

}


/* =====================================================
   LESSON UNLOCK
===================================================== */

function isLessonUnlocked(id){

    /*
      درس اول همیشه باز است.
      هر درس بعدی زمانی باز می‌شود
      که درس قبلی کامل شده باشد.
    */

    if(id === 1)
        return true;

    const previous =
        progress[id - 1];

    return !!(
        previous &&
        previous.completed
    );

}


/* =====================================================
   HOME
===================================================== */

function showHome(){

    setActiveNav("navHome");

    const completed =
        getCompletedCount();

    const total =
        getTotalLessons();

    const percent =
        getProgressPercent();

    const next =
        getLessonIds()
        .find(id =>
            !progress[id] ||
            !progress[id].completed
        );


    document.getElementById("app").innerHTML = `

        <section class="hero">

            <h2>
                👋 به English Master خوش آمدی
            </h2>

            <p>
                قدم‌به‌قدم انگلیسی یاد بگیر،
                لغات جدید یاد بگیر،
                مکالمه تمرین کن و بعد از هر ۱۰ درس
                خودت را با آزمون محک بزن.
            </p>

            <div class="hero-buttons">

                ${
                    next
                    ?
                    `
                    <button
                        class="btn btn-primary"
                        onclick="openLesson(${next})"
                    >
                        ▶ ادامه یادگیری
                    </button>
                    `
                    :
                    `
                    <button
                        class="btn btn-primary"
                        onclick="showLevels()"
                    >
                        🎉 مشاهده درس‌ها
                    </button>
                    `
                }

                <button
                    class="btn btn-dark"
                    onclick="showLevels()"
                >
                    📚 همه درس‌ها
                </button>

            </div>

        </section>


        <section class="progress-card">

            <div class="progress-top">

                <span>
                    پیشرفت شما
                </span>

                <span>
                    ${percent}%
                </span>

            </div>

            <div class="progress-bar">

                <div
                    class="progress-fill"
                    style="width:${percent}%"
                ></div>

            </div>

            <p style="
                margin-top:10px;
                color:var(--muted);
                font-size:13px;
            ">
                ${completed}
                درس از
                ${total}
                درس کامل شده
            </p>

        </section>


        <div class="section-title">

            <h2>
                🎓 سطح‌ها
            </h2>

            <p>
                مسیر یادگیری خودت را انتخاب کن
            </p>

        </div>


        <div class="level-grid">

            ${renderLevelCard("A1","مقدماتی","شروع انگلیسی از پایه",1)}

            ${renderLevelCard("A1+","مقدماتی پلاس","تقویت پایه و مکالمه",31)}

/* =====================================================
   COMPLETE LESSON
===================================================== */

function completeLesson(id){

    if(!progress[id]){

        progress[id] = {

            completed:true,

            stars:1

        };

    }

    else{

        progress[id].completed =
            true;

        if(!progress[id].stars){

            progress[id].stars = 1;

        }

    }


    saveProgress();


    /*
      بعد از کامل کردن درس،
      به درس بعدی می‌رویم.
    */

    const nextId =
        id + 1;


    if(lessons[nextId]){

        showMessage(
            "🎉 درس کامل شد",
            "آفرین! حالا می‌ریم سراغ درس بعدی."
        );


        setTimeout(()=>{

            openLesson(nextId);

        },900);


        return;

    }


    /*
      اگر درس بعدی وجود نداشت
    */

    showMessage(
        "🎉 تبریک!",
        "تمام درس‌های این بخش را کامل کردی."
    );


    setTimeout(()=>{

        showLevels();

    },1000);

}

/* =====================================================
   START EXAM
===================================================== */

function startExam(endLesson){

    const startLesson =
        endLesson - 9;


    const available =
        [];


    for(
        let i=startLesson;
        i<=endLesson;
        i++
    ){

        if(lessons[i]){

            available.push(
                lessons[i]
            );

        }

    }


    if(!available.length){

        showMessage(
            "❌ خطا",
            "سؤال کافی برای آزمون وجود ندارد."
        );

        return;

    }


    examQuestions = [];


    /*
      از لغات درس‌ها سؤال می‌سازیم.
    */

    for(const lesson of available){

        for(const word of lesson.vocab){

            examQuestions.push({

                question:
                    `معنی «${word.en}» چیست؟`,

                answer:
                    word.fa,

                lesson:
                    lesson.id

            });

        }

    }


    /*
      حداکثر 10 سؤال
    */

    examQuestions =
        shuffle(examQuestions)
        .slice(
            0,
            Math.min(10,examQuestions.length)
        );


    examAnswers = {};


    renderExam(
        endLesson
    );

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array){

    const arr =
        [...array];

    for(
        let i=arr.length-1;
        i>0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i+1)
            );

        [
            arr[i],
            arr[j]
        ] =
        [
            arr[j],
            arr[i]
        ];

    }

    return arr;

}


/* =====================================================
   EXAM RENDER
===================================================== */

function renderExam(endLesson){

    setActiveNav("navLessons");


    document.getElementById("app").innerHTML = `

            </p>

        </section>


        ${
            examQuestions.map(
                (q,index)=>`

                    <div class="exam-question">

                        <h3>
                            ${index+1}.
                            ${escapeHTML(q.question)}
                        </h3>

                        <div class="options">

                            ${makeOptions(q,index)}

                        </div>

                    </div>

                `
            ).join("")
        }


        <button
            class="submit-exam"

        >
            📊 ثبت پاسخ‌ها
        </button>

    `;

}


/* =====================================================
   MAKE OPTIONS
===================================================== */

function makeOptions(question,index){

    const answers = [

        question.answer

    ];


    /*
      جواب‌های اشتباه را از کل لغات می‌گیریم.
    */

    const allWords =
        Object.values(lessons)
        .flatMap(
            lesson =>
                lesson.vocab
                .map(v=>v.fa)
        );


    const wrong =
        shuffle(
            allWords.filter(
                x => x !== question.answer
            )
        )
        .slice(0,3);


    answers.push(...wrong);


    const finalOptions =
        shuffle(
            [...new Set(answers)]
        )
        .slice(0,4);


    return finalOptions
        .map(
            option => `

                <button
                    class="option"
                    onclick="
                        selectExamAnswer(
                            ${index},
                            this,
                            '${escapeHTML(option).replaceAll("'","\\'")}'
                        )
                    "
                >
                    ${escapeHTML(option)}
                </button>

            `
        )
        .join("");

}


/* =====================================================
   SELECT ANSWER
===================================================== */

function selectExamAnswer(
    index,
    element,
    answer
){

    examAnswers[index] =
        answer;


    const parent =
        element.parentElement;


    parent
        .querySelectorAll(".option")
        .forEach(btn =>
            btn.classList.remove("selected")
        );


    element.classList.add(
        "selected"
    );

}


/* =====================================================
   SUBMIT EXAM
===================================================== */

function submitExam(endLesson){

    let correct = 0;


    examQuestions.forEach(
        (question,index)=>{

            if(
                examAnswers[index] ===
                question.answer
            ){

                correct++;

            }

        }
    );


    const total =
        examQuestions.length;


    const percent =
        total
        ?
        Math.round(
            correct / total * 100
        )
        :
        0;


    /*
      حداقل 70 درصد
    */

    if(percent >= 70){

        /*
          سه ستاره برای نمره‌های بالا
        */

        let stars = 1;

        if(percent >= 90)
            stars = 3;

        else if(percent >= 80)
            stars = 2;


        /*
          برای ده درس پایانی
          نتیجه آزمون ذخیره می‌شود.
        */

        progress[
            "exam_" + endLesson
        ] = {

            passed:true,

            score:percent,

            stars:stars

        };


        saveProgress();


        document.getElementById("app").innerHTML = `

            <div class="empty">

                <div style="
                    font-size:55px;
                    margin-bottom:15px;
                ">
                    🎉
                </div>

                <h2>
                    آزمون را قبول شدی!
                </h2>

                <p style="
                    margin-top:12px;
                    color:var(--muted);
                ">
                    نمره شما:
                    <strong>
                        ${percent}٪
                    </strong>
                </p>

                <p style="
                    margin-top:12px;
                    color:#f59e0b;
                    font-size:25px;
                ">
                    ${
                        "★".repeat(stars)
                    }${
                        "☆".repeat(3-stars)
                    }
                </p>

                <button
                    class="complete-btn"
                    style="margin-top:20px"
                    onclick="showLevels()"
                >
                    ادامه یادگیری
                </button>

            </div>

        `;

    }

    else{

        document.getElementById("app").innerHTML = `

            <div class="empty">

                <div style="
                    font-size:55px;
                    margin-bottom:15px;
                ">
                    📚
                </div>

                <h2>
                    این بار قبول نشدی
                </h2>

                <p style="
                    margin-top:12px;
                    color:var(--muted);
                ">
                    نمره شما:
                    <strong>
                        ${percent}٪
                    </strong>
                </p>

                <p style="
                    margin-top:10px;
                    color:var(--muted);
                ">
                    برای قبولی حداقل ۷۰٪ لازم است.
                </p>

                <button
                    class="complete-btn"
                    style="margin-top:20px"
                    onclick="startExam(${endLesson})"
                >
                    🔄 دوباره امتحان بده
                </button>

            </div>

        `;

    }

}
