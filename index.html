<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>English Master | آموزش زبان انگلیسی</title>

  <meta name="description"
        content="آموزش زبان انگلیسی از A1 تا سطوح بالاتر با درس، مکالمه، لغات و آزمون">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #171923;
      --muted: #707784;
      --primary: #6757ff;
      --primary2: #806cff;
      --border: #e5e7ef;
      --success: #20b26b;
      --danger: #ef4444;
      --warning: #f59e0b;
      --shadow: 0 8px 30px rgba(0,0,0,.07);
    }

    body.dark {
      --bg: #0e1017;
      --card: #171a23;
      --text: #f4f5f7;
      --muted: #a2a7b2;
      --border: #292e3a;
      --shadow: 0 8px 30px rgba(0,0,0,.25);
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: .25s;
    }

    button {
      border: none;
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding-bottom: 100px;
    }

    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: white;
      font-size: 21px;
      font-weight: bold;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      box-shadow: 0 7px 20px rgba(103,87,255,.3);
    }

    .logo-title {
      font-weight: bold;
      font-size: 17px;
    }

    .logo-sub {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 19px;
    }

    /* HOME */

    main {
      padding: 18px;
    }

    .hero {
      background: linear-gradient(
        135deg,
        var(--primary),
        var(--primary2)
      );
      color: white;
      border-radius: 25px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 15px 35px rgba(103,87,255,.25);
    }

    .hero h1 {
      font-size: 25px;
      margin-bottom: 10px;
    }

    .hero p {
      line-height: 1.9;
      opacity: .92;
      font-size: 14px;
    }

    .progress-box {
      margin-top: 20px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .progress {
      width: 100%;
      height: 9px;
      background: rgba(255,255,255,.25);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress > div {
      height: 100%;
      background: white;
      border-radius: 99px;
      transition: .4s;
    }

    /* SECTION */

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 25px 0 13px;
    }

    .section-title h2 {
      font-size: 18px;
    }

    .section-title span {
      color: var(--muted);
      font-size: 12px;
    }

    /* LEVELS */

    .levels {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .level {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 19px;
      padding: 17px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      text-align: right;
    }

    .level.locked {
      opacity: .65;
    }

    .level-icon {
      width: 45px;
      height: 45px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: rgba(103,87,255,.12);
      margin-bottom: 12px;
      font-size: 20px;
    }

    .level h3 {
      font-size: 16px;
      margin-bottom: 5px;
    }

    .level p {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.7;
    }

    .lock {
      position: absolute;
      top: 13px;
      left: 13px;
      font-size: 17px;
    }

    /* LESSONS */

    .lessons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .lesson {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 14px;
      cursor: pointer;
      transition: .2s;
      position: relative;
    }

    .lesson:hover {
      transform: translateY(-2px);
    }

    .lesson.locked {
      opacity: .55;
      cursor: not-allowed;
    }

    .lesson-number {
      color: var(--primary);
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .lesson-title {
      font-size: 14px;
      font-weight: bold;
    }

    .lesson-status {
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .stars {
      color: #fbbf24;
      letter-spacing: 1px;
      margin-top: 7px;
      font-size: 13px;
    }

    /* LESSON PAGE */

    .back-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 11px 15px;
      border-radius: 13px;
      margin-bottom: 15px;
    }

    .lesson-head {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 14px;
    }

    .lesson-head h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .lesson-head p {
      color: var(--muted);
      font-size: 13px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 21px;
      padding: 19px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    /* VOCAB */

    .word {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
    }

    .word:last-child {
      border-bottom: none;
    }

    .word-en {
      direction: ltr;
      text-align: left;
      font-weight: bold;
    }

    .word-fa {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .speak-btn {
      width: 37px;
      height: 37px;
      flex-shrink: 0;
      border-radius: 11px;
      background: rgba(103,87,255,.12);
      color: var(--primary);
      font-size: 16px;
    }

    /* CONVERSATION */

    .chat {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .message {
      max-width: 88%;
      padding: 12px 14px;
      border-radius: 16px;
      line-height: 1.7;
      font-size: 13px;
    }

    .message.a {
      align-self: flex-start;
      background: rgba(103,87,255,.12);
      direction: ltr;
      text-align: left;
      border-bottom-left-radius: 4px;
    }

    .message.b {
      align-self: flex-end;
      background: var(--primary);
      color: white;
      direction: ltr;
      text-align: left;
      border-bottom-right-radius: 4px;
    }

    .speaker {
      font-size: 10px;
      opacity: .65;
      margin-bottom: 3px;
    }

    .translation {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
      direction: rtl;
      text-align: right;
    }

    /* BUTTON */

    .primary-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color: white;
      padding: 15px;
      border-radius: 15px;
      font-weight: bold;
      font-size: 14px;
      margin-top: 5px;
    }

    .secondary-btn {
      width: 100%;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 15px;
      margin-top: 8px;
    }

    /* EXAM */

    .exam-question {
      padding: 17px;
      background: var(--bg);
      border-radius: 17px;
      margin-bottom: 13px;
      border: 1px solid var(--border);
    }

    .question-number {
      color: var(--primary);
      font-weight: bold;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .question-text {
      direction: ltr;
      text-align: left;
      line-height: 1.7;
      margin-bottom: 12px;
    }

    .options {
      display: grid;
      gap: 8px;
    }

    .option {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 11px;
      border-radius: 12px;
      direction: ltr;
      text-align: left;
    }

    .option.selected {
      border-color: var(--primary);
      background: rgba(103,87,255,.1);
    }

    .result {
      text-align: center;
      padding: 25px;
    }

    .score {
      font-size: 45px;
      font-weight: bold;
      color: var(--primary);
      margin: 12px;
    }

    .result-message {
      line-height: 2;
      color: var(--muted);
    }

    /* SETTINGS */

    .setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }

    .setting:last-child {
      border-bottom: none;
    }

    .setting-title {
      font-weight: bold;
      font-size: 14px;
    }

    .setting-sub {
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
    }

    .switch {
      width: 50px;
      height: 28px;
      border-radius: 99px;
      background: #777;
      padding: 3px;
      transition: .2s;
    }

    .switch span {
      width: 22px;
      height: 22px;
      background: white;
      display: block;
      border-radius: 50%;
      transition: .2s;
    }

    .switch.active {
      background: var(--primary);
    }

    .switch.active span {
      transform: translateX(-22px);
    }

    /* BOTTOM NAV */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(900px, 100%);
      z-index: 100;
      padding: 10px 13px calc(10px + env(safe-area-inset-bottom));
      background: color-mix(in srgb, var(--card) 94%, transparent);
      backdrop-filter: blur(18px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .nav-btn {
      background: transparent;
      color: var(--muted);
      padding: 7px;
      border-radius: 13px;
      font-size: 11px;
    }

    .nav-btn.active {
      color: var(--primary);
      background: rgba(103,87,255,.1);
    }

    .nav-icon {
      display: block;
      font-size: 19px;
      margin-bottom: 3px;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: min(600px, 100%);
      background: var(--card);
      border-radius: 25px 25px 0 0;
      padding: 24px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-box h2 {
      margin-bottom: 10px;
    }

    .modal-box p {
      color: var(--muted);
      line-height: 1.9;
      font-size: 13px;
    }

    .close-btn {
      float: left;
      background: var(--bg);
      color: var(--text);
      width: 35px;
      height: 35px;
      border-radius: 10px;
    }

    /* EMPTY */

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }

    .empty-icon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    /* RESPONSIVE */

    @media (min-width: 650px) {
      .levels {
        grid-template-columns: repeat(4, 1fr);
      }

      .lessons {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 400px) {
      main {
        padding: 13px;
      }

      .levels {
        grid-template-columns: 1fr 1fr;
      }

      .lessons {
        grid-template-columns: 1fr 1fr;
      }

      .hero h1 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header>
    <div class="header-inner">

      <div class="logo">
        <div class="logo-icon">EN</div>

        <div>
          <div class="logo-title">English Master</div>
          <div class="logo-sub">یادگیری زبان انگلیسی</div>
        </div>
      </div>

      <button class="icon-btn" onclick="toggleDarkMode()" id="themeBtn">
        🌙
      </button>

    </div>
  </header>

  <!-- CONTENT -->
  <main id="app"></main>

</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">

  <button class="nav-btn active" onclick="showHome()">
    <span class="nav-icon">🏠</span>
    خانه
  </button>

  <button class="nav-btn" onclick="showLevels()">
    <span class="nav-icon">📚</span>
    درس‌ها
  </button>

  <button class="nav-btn" onclick="showSettings()">
    <span class="nav-icon">⚙️</span>
    تنظیمات
  </button>

</nav>

<!-- MODAL -->
<div class="modal" id="modal">

  <div class="modal-box">

    <button class="close-btn" onclick="closeModal()">×</button>

    <h2 id="modalTitle"></h2>

    <p id="modalText"></p>

  </div>

</div>

<script>

/* =========================================================
   ENGLISH MASTER
   خواندن مستقیم A.txt و Aplus.txt
========================================================= */

let lessons = {};
let currentLesson = null;

const STORAGE_KEY = "english_master_progress_v1";

let progress = JSON.parse(
  localStorage.getItem(STORAGE_KEY) || "{}"
);


/* =========================================================
   خواندن فایل‌های TXT
========================================================= */

async function loadEnglishData() {

  try {

    const responses = await Promise.all([
      fetch("./A.txt"),
      fetch("./Aplus.txt")
    ]);

    if (!responses[0].ok) {
      throw new Error("A.txt پیدا نشد");
    }

    if (!responses[1].ok) {
      throw new Error("Aplus.txt پیدا نشد");
    }

    const a1Text = await responses[0].text();
    const aPlusText = await responses[1].text();

    const a1Lessons = parseLessons(a1Text);
    const aPlusLessons = parseLessons(aPlusText);

    lessons = {
      ...a1Lessons,
      ...aPlusLessons
    };

    console.log(
      "English Master loaded:",
      Object.keys(lessons).length,
      "lessons"
    );

    showHome();

  } catch (error) {

    console.error(error);

    document.getElementById("app").innerHTML = `
      <div class="empty">

        <div class="empty-icon">⚠️</div>

        <h2>خطا در بارگذاری درس‌ها</h2>

        <p style="margin-top:10px">
          مطمئن شوید این سه فایل در کنار هم قرار دارند:
        </p>

        <div class="card" style="margin-top:15px;text-align:left;direction:ltr">
          index.html<br>
          A.txt<br>
          Aplus.txt
        </div>

      </div>
    `;

  }

}


/* =========================================================
   تبدیل متن TXT به درس
========================================================= */

function parseLessons(text) {

  const result = {};

  const regex = /===\s*درس\s+(\d+)\s*\(([^)]+)\)\s*===([\s\S]*?)(?=\n===\s*درس\s+\d+|\n={10,}|$)/g;

  let match;

  while ((match = regex.exec(text)) !== null) {

    const id = Number(match[1]);
    const level = match[2].trim();
    const body = match[3];

    const vocab = [];
    const conversation = [];

    /* -----------------------------
       معنی‌ها
    ----------------------------- */

    const meaningMatch = body.match(
      /معنی‌ها:\s*([\s\S]*?)(?=\n\s*مکالمه:|$)/
    );

    if (meaningMatch) {

      const lines = meaningMatch[1].split(/\r?\n/);

      for (const line of lines) {

        const m = line.match(
          /^\s*\d+\.\s*(.*?)\s*=\s*(.*?)\s*$/
        );

        if (m) {

          vocab.push({
            en: m[1].trim(),
            fa: m[2].trim()
          });

        }

      }

    }


    /* -----------------------------
       مکالمه
    ----------------------------- */

    const conversationMatch = body.match(
      /مکالمه:\s*([\s\S]*?)/
    );

    if (conversationMatch) {

      const lines = conversationMatch[1].split(/\r?\n/);

      for (const line of lines) {

        const m = line.match(
          /^\s*([A-Z])\s*:\s*(.+?)\s*$/
        );

        if (m) {

          conversation.push({
            speaker: m[1],
            en: m[2].trim()
          });

        }

      }

    }


    result[id] = {
      id,
      level,
      title: "درس " + id,
      vocab,
      conversation
    };

  }

  return result;
}


/* =========================================================
   ذخیره پیشرفت
========================================================= */

function saveProgress() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(progress)
  );

}


function getLessonProgress(id) {

  return progress[id] || {
    completed: false,
    stars: 0
  };

}


/* =========================================================
   تعیین اینکه درس باز است یا نه
========================================================= */

function isLessonUnlocked(id) {

  if (id === 1) {
    return true;
  }

  const previous = getLessonProgress(id - 1);

  return previous.completed === true;
}


/* =========================================================
   صفحه خانه
========================================================= */

function showHome() {

  setActiveNav(0);

  const total = Object.keys(lessons).length;

  const completed = Object.values(progress)
    .filter(x => x.completed)
    .length;

  const percent = total
    ? Math.round((completed / total) * 100)
    : 0;

  document.getElementById("app").innerHTML = `

    <section class="hero">

      <h1>انگلیسی را حرفه‌ای یاد بگیر 🚀</h1>

      <p>
        درس به درس جلو برو، مکالمه‌ها را بخوان،
        لغات را یاد بگیر و بعد از هر ۱۰ درس در آزمون شرکت کن.
      </p>

      <div class="progress-box">

        <div class="progress-info">
          <span>پیشرفت شما</span>
          <span>${percent}%</span>
        </div>

        <div class="progress">
          <div style="width:${percent}%"></div>
        </div>

      </div>

    </section>


    <div class="section-title">

      <h2>سطح‌ها</h2>

      <span>
        A1 رایگان
      </span>

    </div>


    <div class="levels">

      ${levelCard(
        "A1",
        "مقدماتی",
        "درس‌های ۱ تا ۱۰۰",
        "🟢",
        true
      )}

      ${levelCard(
        "A1+",
        "مقدماتی پیشرفته",
        "درس‌های ۱۰۱ تا ۲۵۰",
        "🔵",
        false
      )}

      ${levelCard(
        "A2",
        "پایه",
        "در حال آماده‌سازی",
        "🟣",
        false
      )}

      ${levelCard(
        "B1",
        "متوسط",
        "در حال آماده‌سازی",
        "🟠",
        false
      )}

    </div>


    <div class="section-title">

      <h2>ادامه یادگیری</h2>

    </div>

    ${getContinueLesson()}

  `;

}


function levelCard(
  name,
  title,
  description,
  icon,
  unlocked
) {

  return `

    <div
      class="level ${unlocked ? "" : "locked"}"
      onclick="${
        unlocked
        ? `showLevel('${name}')`
        : `showLockedLevel('${name}')`
      }"
    >

      ${!unlocked ? `<div class="lock">🔒</div>` : ""}

      <div class="level-icon">
        ${icon}
      </div>

      <h3>${name}</h3>

      <p>
        ${title}<br>
        ${description}
      </p>

    </div>
  `;
}


/* =========================================================
   ادامه درس
========================================================= */

function getContinueLesson() {

  const ids = Object.keys(lessons)
    .map(Number)
    .sort((a,b) => a-b);

  for (const id of ids) {

    if (!getLessonProgress(id).completed) {

      const lesson = lessons[id];

      return `

        <div
          class="card"
          style="cursor:pointer"
          onclick="openLesson(${id})"
        >

          <div style="display:flex;align-items:center;gap:13px">

            <div class="level-icon">
              📖
            </div>

            <div style="flex:1">

              <div style="font-size:11px;color:var(--muted)">
                ادامه یادگیری
              </div>

              <div style="font-weight:bold;margin-top:4px">
                ${lesson.title}
              </div>

              <div style="font-size:11px;color:var(--muted);margin-top:4px">
                ${lesson.level}
              </div>

  return `

/* =========================================================
   صفحه سطح
========================================================= */

function showLevel(level) {

  setActiveNav(1);

  let min = 1;
  let max = 100;

  if (level === "A1+") {
    min = 101;
    max = 250;
  }

  const ids = Object.keys(lessons)
    .map(Number)
    .filter(id => id >= min && id <= max)
    .sort((a,b) => a-b);

  document.getElementById("app").innerHTML = `

    <button
      class="back-btn"
      onclick="showHome()"
    >
      ← بازگشت
    </button>

    <div class="lesson-head">

      <h1>${level}</h1>

      <p>

          ? "سطح مقدماتی"
          : "سطح A1+"}

    </div>

    <div class="lessons">

      ${
        ids.length
        ? ids.map(id => lessonCard(id)).join("")
        : `
          <div class="card" style="grid-column:1/-1">
            <div class="empty">
              <div class="empty-icon">🚧</div>
              این سطح هنوز آماده نشده است.
            </div>
          </div>
        `
      }

    </div>

  `;
}


/* =========================================================
   کارت درس
========================================================= */

function lessonCard(id) {

  const lesson = lessons[id];

  if (!lesson) return "";

  const p = getLessonProgress(id);

  const unlocked = isLessonUnlocked(id);

  const stars =
    "★".repeat(p.stars || 0) +
    "☆".repeat(3 - (p.stars || 0));

  return `

    <div
      class="lesson ${unlocked ? "" : "locked"}"
      onclick="${unlocked ? `openLesson(${id})` : `showLockedLesson('${id}')`}"
    >

      <div class="lesson-number">
        ${lesson.level}
      </div>

      <div class="lesson-title">
        درس ${id}
      </div>

      <div class="lesson-status">

        ${
          p.completed
          ? "✓ تکمیل شده"
          : unlocked
            ? "شروع درس"
            : "🔒 قفل"
        }

      </div>

      ${
        p.completed
        ? `<div class="stars">${stars}</div>`
        : ""
      }

    </div>

  `;
}

/* =========================================================
   ترجمه ساده مکالمه
   توجه:
   ترجمه اصلی مکالمه در TXT برای بخش‌های آزمون وجود دارد،
   اما برای مکالمه درس‌ها در فایل فقط متن انگلیسی ذخیره شده.
========================================================= */

function translateSimple(text) {

  const dictionary = {

    "Hello": "سلام",
    "Hi": "سلام",
    "Good morning": "صبح بخیر",
    "Good evening": "عصر بخیر",
    "Thank you": "ممنون",
    "Thanks": "ممنون",
    "Yes": "بله",
    "No": "نه",
    "Please": "لطفاً",
    "Goodbye": "خداحافظ",
    "How are you?": "حالت چطور است؟",
    "What's your name?": "اسمت چیست؟",
    "My name is Ali.": "اسم من علی است.",
    "Where do you live?": "کجا زندگی می‌کنی؟",
    "I live in a big city.": "من در یک شهر بزرگ زندگی می‌کنم.",
    "What do you do?": "چه کار می‌کنی؟",
    "I'm a teacher.": "من معلم هستم.",
    "Do you study every day?": "آیا هر روز مطالعه می‌کنی؟",
    "Yes, I study English.": "بله، انگلیسی مطالعه می‌کنم.",
    "What country are you from?": "اهل کدام کشور هستی؟",
    "I'm from Iran.": "من اهل ایران هستم.",
    "What language do you speak?": "چه زبانی صحبت می‌کنی؟",
    "Persian.": "فارسی.",
    "What's the weather like today?": "امروز هوا چطور است؟",
    "It's cloudy and windy.": "هوا ابری و بادی است."

  };

  if (dictionary[text]) {
    return dictionary[text];
  }

  return "";
}


/* =========================================================
   تکمیل درس
========================================================= */

function completeLesson(id) {

  if (!progress[id]) {

    progress[id] = {
      completed: true,
      stars: 1
    };

  } else {

    progress[id].completed = true;

    if (!progress[id].stars) {
      progress[id].stars = 1;
    }

  }

  saveProgress();

  showMessage(
    "درس کامل شد 🎉",
    "آفرین! این درس با موفقیت ثبت شد. حالا می‌توانی سراغ درس بعدی بروی."
  );

  setTimeout(() => {
    openLesson(id);
  }, 900);

}


/* =========================================================
   آزمون
========================================================= */

function startExam(endLesson) {

  const startLessonNumber = endLesson - 9;

  const available = [];

  for (
    let i = startLessonNumber;
    i <= endLesson;
    i++
  ) {

    if (lessons[i]) {
      available.push(lessons[i]);
    }

  }

  if (!available.length) {

    showMessage(
      "آزمون موجود نیست",
      "درس‌های این بخش در فایل TXT پیدا نشدند."
    );

    return;
  }

  const questions = createExamQuestions(available);

  window.currentExam = {
    endLesson,
    questions,
    answers: {}
  };

  renderExam();

}


/* =========================================================
   ساخت سؤال آزمون از لغات خود TXT
========================================================= */

function createExamQuestions(lessonList) {

  const questions = [];

  for (const lesson of lessonList) {

    for (const word of lesson.vocab) {

      if (questions.length >= 10) {
        break;
      }

      const wrong = [];

      for (const other of lessonList) {

        for (const w of other.vocab) {

          if (
            w.en !== word.en &&
            wrong.length < 3
          ) {

            wrong.push(w.fa);

          }

        }

      }

      const options = [
        word.fa,
        ...wrong
      ].slice(0, 4);

      while (options.length < 4) {
        options.push("گزینه دیگر");
      }

      shuffle(options);

      questions.push({
        type: "meaning",
        text: word.en,
        answer: word.fa,
        options
      });

    }

    if (questions.length >= 10) {
      break;
    }

  }

  return questions.slice(0, 10);
}


/* =========================================================
   نمایش آزمون
========================================================= */

function renderExam() {

  const exam = window.currentExam;

  if (!exam) return;

  document.getElementById("app").innerHTML = `

    <button
      class="back-btn"
      onclick="openLesson(${exam.endLesson})"
    >
      ← خروج از آزمون
    </button>


    <div class="lesson-head">

      <h1>📝 آزمون</h1>

      <p>
        برای قبولی حداقل ۷۰٪ لازم است.
      </p>

    </div>


    <div class="card">

      ${
        exam.questions.map((q, index) => `

          <div class="exam-question">

            <div class="question-number">
              سؤال ${index + 1}
            </div>

            <div class="question-text">
              معنی این کلمه چیست؟
              <br><br>
              <strong>${escapeHtml(q.text)}</strong>
            </div>

            <div class="options">

              ${
                q.options.map((option, oi) => `

                  <button
                    class="option ${
                      exam.answers[index] === option
                      ? "selected"
                      : ""
                    }"
                    onclick="selectAnswer(${index}, '${escapeAttr(option)}')"
                  >
                    ${escapeHtml(option)}
                  </button>

                `).join("")
              }

            </div>

          </div>

        `).join("")
      }


      <button
        class="primary-btn"
        onclick="submitExam()"
      >
        پایان آزمون
      </button>

    </div>

  `;

}


/* =========================================================
   انتخاب جواب
========================================================= */

function selectAnswer(index, answer) {

  window.currentExam.answers[index] = answer;

  renderExam();

}


/* =========================================================
   نتیجه آزمون
========================================================= */

function submitExam() {

  const exam = window.currentExam;

  let correct = 0;

  exam.questions.forEach((q, i) => {

    if (exam.answers[i] === q.answer) {
      correct++;
    }

  });

  const score = Math.round(
    correct / exam.questions.length * 100
  );

  const passed = score >= 70;

  let stars = 0;

  if (passed) {

    if (score >= 90) {
      stars = 3;
    } else if (score >= 80) {
      stars = 2;
    } else {
      stars = 1;
    }

    const end = exam.endLesson;

    if (!progress[end]) {
      progress[end] = {};
    }

    progress[end].examPassed = true;
    progress[end].examScore = score;
    progress[end].stars = Math.max(
      progress[end].stars || 0,
      stars
    );

    saveProgress();

  }


  document.getElementById("app").innerHTML = `

    <div class="card">

      <div class="result">

        <div style="font-size:50px">
          ${passed ? "🎉" : "📚"}
        </div>

        <h2>
          ${passed ? "آزمون را قبول شدی!" : "این بار قبول نشدی"}
        </h2>

        <div class="score">
          ${score}%
        </div>

        <div class="result-message">

          پاسخ صحیح:
          ${correct}
          از
          ${exam.questions.length}

          <br><br>

          ${
            passed
            ? `
              حداقل نمره قبولی ۷۰٪ است.
              <br>
              ⭐ ${stars} ستاره گرفتی.
            `
            : `
              برای قبولی باید حداقل ۷۰٪ بگیری.
              <br>
              دوباره تلاش کن 💪
            `
          }

        </div>

        ${
          passed
          ? `
            <button
              class="primary-btn"
              onclick="showLevel('${lessons[exam.endLesson]?.level || "A1"}')"
            >
              ادامه درس‌ها
            </button>
          `
          : `
            <button
              class="primary-btn"
              onclick="startExam(${exam.endLesson})"
            >
              🔄 تلاش دوباره
            </button>
          `
        }

      </div>

    </div>

  `;

}

/* =========================================================

========================================================= */

function speak(text) {

  if (!("speechSynthesis" in window)) {

    showMessage(
      "تلفظ در دسترس نیست",
      "مرورگر شما از قابلیت تبدیل متن به صدا پشتیبانی نمی‌کند."
    );

    return;
  }

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang = "en-US";
  utterance.rate = .85;
  utterance.pitch = 1;

  speechSynthesis.speak(utterance);

}

function resetProgress() {

  );

  if (!ok) return;

  progress = {};

  localStorage.removeItem(STORAGE_KEY);

    "انجام شد",
    "تمام پیشرفت‌ها حذف شدند."
  );

  setTimeout(showHome, 800);

}


/* =========================================================
   ابزارها
========================================================= */

function shuffle(array) {

  for (
    let i = array.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(Math.random() * (i + 1));

    [
      array[i],
      array[j]
    ] = [
      array[j],
      array[i]
    ];

  }

  return array;

}


function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeAttr(value) {

  return String(value)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/"/g, "&quot;");

}
