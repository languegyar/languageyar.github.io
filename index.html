<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>English Master</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

:root{
    --bg:#f5f7fb;
    --card:#fff;
    --text:#182033;
    --muted:#718096;
    --primary:#5b5bf7;
    --primary2:#8b5cf6;
    --border:#e5e7eb;
    --green:#16a34a;
    --red:#ef4444;
    --orange:#f59e0b;
    --shadow:0 8px 30px rgba(0,0,0,.07);
}

body.dark{
    --bg:#0f1117;
    --card:#181b24;
    --text:#f5f7fb;
    --muted:#9ca3af;
    --border:#292d38;
    --shadow:0 8px 30px rgba(0,0,0,.25);
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding-bottom:75px;
}

button{
    border:0;
    cursor:pointer;
}

.app{
    max-width:1100px;
    margin:auto;
}

/* HEADER */

.header{
    position:sticky;
    top:0;
    z-index:50;
    height:70px;
    padding:10px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--bg);
    border-bottom:1px solid var(--border);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-icon{
    width:43px;
    height:43px;
    border-radius:14px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-weight:bold;
    background:linear-gradient(
        135deg,
        var(--primary),
        var(--primary2)
    );
}

.logo h1{
    font-size:18px;
}

.logo small{
    color:var(--muted);
    display:block;
    margin-top:3px;
}

.icon-btn{
    width:42px;
    height:42px;
    border-radius:13px;
    background:var(--card);
    color:var(--text);
    border:1px solid var(--border);
    font-size:19px;
}

/* MAIN */

main{
    padding:20px;
}

.section-title{
    margin-bottom:18px;
}

.section-title h2{
    font-size:23px;
}

.section-title p{
    margin-top:6px;
    color:var(--muted);
}

/* HERO */

.hero{
    color:white;
    padding:28px;
    border-radius:25px;
    margin-bottom:20px;
    background:linear-gradient(
        135deg,
        var(--primary),
        var(--primary2)
    );
    box-shadow:0 15px 40px rgba(91,91,247,.22);
}

.hero h2{
    font-size:26px;
    margin-bottom:10px;
}

.hero p{
    line-height:2;
    opacity:.92;
}

.hero-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;
}

.btn{
    padding:13px 20px;
    border-radius:13px;
    font-weight:bold;
}

.btn-white{
    background:#fff;
    color:#5146e5;
}

.btn-transparent{
    background:rgba(0,0,0,.18);
    color:#fff;
}

/* PROGRESS */

.progress-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
    margin-bottom:25px;
    box-shadow:var(--shadow);
}

.progress-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:12px;
}

.progress-top b{
    color:var(--primary);
}

.progress{
    height:11px;
    background:var(--border);
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    background:linear-gradient(
        90deg,
        var(--primary),
        var(--primary2)
    );
    transition:.4s;
}

/* LEVEL */

.level-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.level-card{
    position:relative;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:.2s;
}

.level-card:hover{
    transform:translateY(-3px);
}

.level-icon{
    width:50px;
    height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:15px;
    background:rgba(91,91,247,.12);
    color:var(--primary);
    font-weight:bold;
    margin-bottom:15px;
}

.level-card p{
    color:var(--muted);
    font-size:13px;
    line-height:1.8;
    margin-top:6px;
}

.level-lock{
    position:absolute;
    top:15px;
    left:15px;
}

/* LESSONS */

.lesson-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.lesson-card{
    position:relative;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:19px;
    padding:18px;
    box-shadow:var(--shadow);
    cursor:pointer;
    transition:.2s;
}

.lesson-card:hover{
    transform:translateY(-3px);
}

.lesson-card.locked{
    opacity:.45;
    cursor:not-allowed;
}

.lesson-card.completed{
    border-color:rgba(22,163,74,.45);
}

.lesson-number{
    color:var(--primary);
    font-weight:bold;
    font-size:13px;
    margin-bottom:8px;
}

.lesson-card h3{
    margin-bottom:12px;
}

.lesson-info{
    display:flex;
    justify-content:space-between;
    color:var(--muted);
    font-size:12px;
}

.stars{
    color:var(--orange);
    letter-spacing:2px;
}

/* LESSON */

.back{
    padding:10px 15px;
    border-radius:12px;
    background:var(--card);
    color:var(--text);
    border:1px solid var(--border);
    margin-bottom:18px;
}

.lesson-header{
    padding:25px;
    border-radius:23px;
    color:white;
    background:linear-gradient(
        135deg,
        var(--primary),
        var(--primary2)
    );
    margin-bottom:18px;
}

.lesson-header small{
    opacity:.8;
}

.lesson-header h2{
    margin-top:7px;
}

/* CONTENT */

.content-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:var(--shadow);
}

.content-card h3{
    margin-bottom:15px;
}

/* VOCAB */

.vocab-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid var(--border);
}

.vocab-item:last-child{
    border-bottom:0;
}

.vocab-left{
    direction:ltr;
    text-align:left;
    flex:1;
}

.vocab-en{
    font-weight:bold;
    font-size:16px;
}

.vocab-fa{
    color:var(--muted);
    text-align:right;
    direction:rtl;
    margin-top:5px;
}

.speak{
    flex-shrink:0;
    width:40px;
    height:40px;
    border-radius:12px;
    background:rgba(91,91,247,.1);
    color:var(--primary);
    font-size:18px;
}

/* CONVERSATION */

.conversation{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.message{
    max-width:88%;
    padding:14px;
    border-radius:17px;
}

.message.a{
    align-self:flex-start;
    background:rgba(91,91,247,.11);
}

.message.b{
    align-self:flex-end;
    background:rgba(22,163,74,.11);
}

.message-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
}

.speaker{
    font-size:11px;
    color:var(--primary);
    font-weight:bold;
}

.message-en{
    direction:ltr;
    text-align:left;
    line-height:1.8;
}

.message-fa{
    color:var(--muted);
    font-size:13px;
    margin-top:5px;
    line-height:1.8;
}

.complete-btn{
    width:100%;
    padding:16px;
    border-radius:16px;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    background:linear-gradient(
        135deg,
        var(--primary),
        var(--primary2)
    );
}

/* READING */

.reading-box{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:15px;
    padding:15px;
    direction:ltr;
    text-align:left;
    line-height:2;
}

.reading-line{
    display:flex;
    align-items:flex-start;
    gap:10px;
    margin-bottom:8px;
}

.reading-line:last-child{
    margin-bottom:0;
}

.read-text{
    flex:1;
}

/* EXAM */

.exam-header{
    padding:25px;
    border-radius:23px;
    color:#fff;
    background:linear-gradient(
        135deg,
        var(--primary),
        var(--primary2)
    );
    margin-bottom:20px;
}

.exam-header h2{
    margin-bottom:10px;
}

.exam-header p{
    line-height:1.8;
    opacity:.9;
}

.question{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
    margin-bottom:15px;
}

.question-number{
    color:var(--primary);
    font-size:12px;
    margin-bottom:8px;
}

.question-title{
    font-size:17px;
    margin-bottom:15px;
}

.question-title-en{
    direction:ltr;
    text-align:left;
    display:block;
    margin-top:8px;
}

.options{
    display:grid;
    gap:10px;
}

.option{
    width:100%;
    text-align:right;
    padding:14px;
    border-radius:13px;
    background:var(--bg);
    color:var(--text);
    border:1px solid var(--border);
    transition:.15s;
}

.option:hover{
    border-color:var(--primary);
}

.option.selected{
    background:rgba(91,91,247,.12);
    border-color:var(--primary);
}

.exam-submit{
    width:100%;
    padding:17px;
    border-radius:16px;
    color:white;
    background:linear-gradient(
        135deg,
        var(--primary),
        var(--primary2)
    );
    font-size:16px;
    font-weight:bold;
}

/* RESULT */

.result{
    text-align:center;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:25px;
    padding:35px 20px;
    box-shadow:var(--shadow);
}

.result-icon{
    font-size:60px;
    margin-bottom:15px;
}

.result-score{
    font-size:35px;
    font-weight:bold;
    color:var(--primary);
    margin:12px 0;
}

.result-stars{
    color:var(--orange);
    font-size:30px;
    letter-spacing:5px;
}

/* SETTINGS */

.setting{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:17px;
    padding:18px;
    margin-bottom:12px;
}

.setting p{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.speed-buttons{
    display:flex;
    gap:7px;
}

.speed-btn{
    padding:8px 11px;
    border-radius:9px;
    background:var(--bg);
    color:var(--text);
    border:1px solid var(--border);
}

.speed-btn.active{
    background:var(--primary);
    color:#fff;
}

/* NAV */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:min(100%,1100px);
    height:70px;
    z-index:100;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    background:var(--card);
    border-top:1px solid var(--border);
}

.nav-btn{
    background:none;
    color:var(--muted);
}

.nav-btn.active{
    color:var(--primary);
    font-weight:bold;
}

.nav-icon{
    display:block;
    font-size:20px;
    margin-bottom:3px;
}

/* TOAST */

.toast{
    position:fixed;
    top:85px;
    left:50%;
    transform:translateX(-50%) translateY(-15px);
    background:var(--card);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    padding:14px 20px;
    border-radius:15px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:500;
    min-width:250px;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* LOADING */

.loading{
    text-align:center;
    padding:70px 20px;
    color:var(--muted);
}

.spinner{
    width:42px;
    height:42px;
    margin:0 auto 15px;
    border:4px solid var(--border);
    border-top-color:var(--primary);
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.empty{
    text-align:center;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:35px;
    color:var(--muted);
}

/* MOBILE */

@media(max-width:850px){

    .level-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .lesson-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:550px){

    main{
        padding:14px;
    }

    .header{
        padding:10px 14px;
    }

    .hero{
        padding:22px;
    }

    .hero h2{
        font-size:22px;
    }

    .level-grid,
    .lesson-grid{
        grid-template-columns:1fr;
    }

    .message{
        max-width:94%;
    }

}

</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">

        <div class="logo-icon">
            EN
        </div>

        <div>
            <h1>English Master</h1>
            <small>آموزش زبان انگلیسی</small>
        </div>

    </div>

    <button
        class="icon-btn"
        id="themeBtn"
        onclick="toggleTheme()"
    >
        🌙
    </button>

</header>


<main id="app">

    <div class="loading">

        <div class="spinner"></div>

        <p>
            در حال خواندن درس‌ها...
        </p>

    </div>

</main>


<nav class="bottom-nav">

    <button
        class="nav-btn active"
        id="navHome"
        onclick="showHome()"
    >
        <span class="nav-icon">🏠</span>
        خانه
    </button>

    <button
        class="nav-btn"
        id="navLessons"
        onclick="showLevels()"
    >
        <span class="nav-icon">📚</span>
        درس‌ها
    </button>

    <button
        class="nav-btn"
        id="navSettings"
        onclick="showSettings()"
    >
        <span class="nav-icon">⚙️</span>
        تنظیمات
    </button>

</nav>

</div>


<div
    class="toast"
    id="toast"
></div>


<script>

/* =========================================================
   GLOBAL
========================================================= */

let lessons = {};

let exams = {};

let progress = JSON.parse(
    localStorage.getItem(
        "english_master_progress_v2"
    ) || "{}"
);

let speechRate =
    Number(
        localStorage.getItem(
            "english_master_speech_rate"
        ) || "0.9"
    );

let examQuestions = [];

let examAnswers = {};


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

    if(
        value === undefined ||
        value === null
    ){
        return "";
    }

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================================
   SAVE
========================================================= */

function saveProgress(){

    localStorage.setItem(
        "english_master_progress_v2",
        JSON.stringify(progress)
    );

}


/* =========================================================
   THEME
========================================================= */

function loadTheme(){

    const theme =
        localStorage.getItem(
            "english_master_theme"
        );

    if(theme === "dark"){

        document.body.classList.add("dark");

        document.getElementById(
            "themeBtn"
        ).textContent = "☀️";

    }

}


function toggleTheme(){

    document.body.classList.toggle("dark");

    const dark =
        document.body.classList.contains("dark");

    localStorage.setItem(
        "english_master_theme",
        dark ? "dark" : "light"
    );

    document.getElementById(
        "themeBtn"
    ).textContent =
        dark ? "☀️" : "🌙";

}


/* =========================================================
   TOAST
========================================================= */

function toast(title,text=""){

    const el =
        document.getElementById("toast");

    el.innerHTML = `
        <b>${escapeHTML(title)}</b>
        ${
            text
            ?
            `<br><small>${escapeHTML(text)}</small>`
            :
            ""
        }
    `;

    el.classList.add("show");

    setTimeout(()=>{
        el.classList.remove("show");
    },2000);

}


/* =========================================================
   SPEECH
========================================================= */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ){

        toast(
            "❌ خواندن متن",
            "مرورگر شما از خواندن متن پشتیبانی نمی‌کند."
        );

        return;

    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(text);


    utterance.lang = "en-US";

    utterance.rate =
        speechRate;

    utterance.pitch = 1;

    utterance.volume = 1;


    window.speechSynthesis.speak(
        utterance
    );

}


/* =========================================================
   PARSE LESSONS
========================================================= */

function parseLessons(text){

    const result = {};


    /*
      فقط عنوان‌های واقعی درس
    */

    const sections =
        text.split(
            /(?=^===\s*درس\s+\d+\s*\([^)]+\)\s*===)/gm
        );


    for(const section of sections){

        const header =
            section.match(
                /^===\s*درس\s+(\d+)\s*\(([^)]+)\)\s*===/m
            );


        if(!header)
            continue;


        const id =
            Number(header[1]);

        const level =
            header[2].trim();


        const body =
            section
            .slice(header[0].length)
            .trim();


        /* ==============================================
           VOCAB
        ============================================== */

        const vocab = [];


        const vocabMatch =
            body.match(
                /معنی‌ها:\s*([\s\S]*?)(?=\n\s*مکالمه:|\n={5,}|$)/
            );


        if(vocabMatch){

            const lines =
                vocabMatch[1]
                .split(/\r?\n/);


            for(const line of lines){

                const match =
                    line.match(
                        /^\s*\d+\.\s*(.*?)\s*=\s*(.*?)\s*$/
                    );


                if(match){

                    vocab.push({

                        en:match[1].trim(),

                        fa:match[2].trim()

                    });

                }

            }

        }


        /* ==============================================
           CONVERSATION
        ============================================== */

        const conversation = [];


        const conversationMatch =
            body.match(
                /مکالمه:\s*([\s\S]*?)(?=\n={5,}|$)/
            );


        if(conversationMatch){

            const lines =
                conversationMatch[1]
                .trim()
                .split(/\r?\n/);


            for(const line of lines){

                const match =
                    line.match(
                        /^\s*([A-Z])\s*:\s*(.+?)\s*$/
                    );


                if(match){

                    conversation.push({

                        speaker:
                            match[1],

                        en:
                            match[2].trim()

                    });

                }

            }

        }


        result[id] = {

            id,

            level,

            title:
                "درس " + id,

            vocab,

            conversation

        };

    }


    return result;

}


/* =========================================================
   PARSE EXAMS FROM TXT
========================================================= */

function parseExams(text){

    const result = {};


    /*
      مثال:

      آزمون درس 11 تا 20 (A1)
    */

    const regex =
        /آزمون\s+درس\s+(\d+)\s+تا\s+(\d+)\s*(?:\(([^)]+)\))?([\s\S]*?)(?=\n={5,}|\n\s*---\s*بخش|\n\s*==================================================|$)/g;


    /*
      چون آزمون چند بخش دارد،
      روش جداگانه پایین انجام می‌شود.
    */


    const examStarts = [];


    const startRegex =
        /آزمون\s+درس\s+(\d+)\s+تا\s+(\d+)\s*(?:\(([^)]+)\))?/g;


    let match;


    while(
        (match = startRegex.exec(text))
    ){

        examStarts.push({

            start:
                match.index,

            from:
                Number(match[1]),

            to:
                Number(match[2]),

            level:
                match[3] || ""

        });

    }


    for(let i=0;i<examStarts.length;i++){

        const item =
            examStarts[i];

        const next =
            examStarts[i+1];


        /*
          تا آزمون بعدی یا پایان فایل
        */

        let end =
            next
            ?
            next.start
            :
            text.length;


        /*
          اگر چند خط جداکننده پایان بخش وجود دارد،
          مشکلی ایجاد نمی‌کند.
        */

        const block =
            text.slice(
                item.start,
                end
            );


        const meaning = [];


        /*
          بخش اول آزمون:
          معنی کلمات
        */

        const meaningMatch =
            block.match(
                /---\s*بخش اول:[\s\S]*?---([\s\S]*?)(?=---\s*بخش دوم|$)/
            );


        if(meaningMatch){

            const lines =
                meaningMatch[1]
                .split(/\r?\n/);


            for(const line of lines){

                const m =
                    line.match(
                        /^\s*\d+\.\s*(.*?)\s*=\s*(.*)$/
                    );


                if(m){

                    meaning.push({

                        en:m[1].trim(),

                        fa:m[2]
                            .replace(
                                /[.]+/g,
                                ""
                            )
                            .trim()

                    });

                }

            }

        }


        result[item.to] = {

            from:item.from,

            to:item.to,

            level:item.level,

            meaning

        };

    }


    return result;

}

/* =========================================================
   LESSON IDS
========================================================= */

function getIds(){

    return Object.keys(lessons)
        .map(Number)
        .sort((a,b)=>a-b);

}


function completedCount(){

    return getIds()
        .filter(
            id =>
                progress[id] &&
                progress[id].completed
        )
        .length;

}


function progressPercent(){

    const total =
        getIds().length;

    if(!total)
        return 0;

    return Math.round(
        completedCount() /
        total *
        100
    );

}


/* =========================================================
   UNLOCK
========================================================= */

function isUnlocked(id){

    if(id === 1)
        return true;


    return !!(
        progress[id-1] &&
        progress[id-1].completed
    );

}


/* =========================================================
   LEVEL OF LESSON
========================================================= */

function levelName(id){

    if(id <= 100)
        return "A1";

    if(id <= 250)
        return "A1+";

    return lessons[id]?.level || "";

}

/* =========================================================
   COMPLETE LESSON
========================================================= */

function completeLesson(id){

    if(!progress[id]){

        progress[id] = {

            completed:true,

            stars:1

        };

    }
    else{

        progress[id].completed = true;

        if(!progress[id].stars)
            progress[id].stars = 1;

    }


    saveProgress();


    /*
      اگر این درس دهم، بیستم، سی‌ام...
      باشد، آزمون نمایش داده می‌شود.
    */

    if(
        id % 10 === 0 &&
        exams[id]
    ){

        toast(
            "🎉 ۱۰ درس کامل شد!",
            "وقت آزمون است."
        );


        setTimeout(()=>{

            startExam(id);

        },1000);


        return;

    }


    /*
      درس بعدی
    */

    const next =
        getIds().find(
            x =>
                x > id &&
                !(
                    progress[x] &&
                    progress[x].completed
                )
        );


    if(next){

        toast(
            "🎉 درس کامل شد",
            "می‌ریم سراغ درس بعدی."
        );


        setTimeout(()=>{

            openLesson(next);

        },900);


    }
    else{

        toast(
            "🎉 تبریک!",
            "همه درس‌ها کامل شدند."
        );


        setTimeout(
            showLevels,
            1000
        );

    }

}


/* =========================================================
   START EXAM
========================================================= */

function startExam(endLesson){

    const exam =
        exams[endLesson];


    if(!exam){

        /*
          اگر بخش آزمون داخل TXT
          به هر دلیلی پیدا نشد،
          از معنی‌های خود ۱۰ درس استفاده می‌کنیم.
        */

        createFallbackExam(
            endLesson
        );

        return;

    }


    /*
      سؤال‌های معنی را از درس‌های واقعی می‌گیریم.
    */

    const words = [];


    for(
        let id=exam.from;
        id<=exam.to;
        id++
    ){

        if(!lessons[id])
            continue;


        for(
            const word of lessons[id].vocab
        ){

            words.push({

                en:word.en,

                fa:word.fa,

                lesson:id

            });

        }

    }


    /*
      ۱۰ سؤال
    */

    const selected =
        shuffle(words)
        .slice(
            0,
            Math.min(10,words.length)
        );


    examQuestions =
        selected;


    examAnswers = {};


    renderExam(
        exam.from,
        exam.to
    );

}


/* =========================================================
   FALLBACK EXAM
========================================================= */

function createFallbackExam(endLesson){

    const start =
        endLesson - 9;


    const words = [];


    for(
        let id=start;
        id<=endLesson;
        id++
    ){

        if(!lessons[id])
            continue;


        words.push(
            ...lessons[id].vocab
        );

    }


    examQuestions =
        shuffle(words)
        .slice(
            0,
            Math.min(10,words.length)
        );


    examAnswers = {};


    renderExam(
        start,
        endLesson
    );

}


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    const a =
        [...array];


    for(
        let i=a.length-1;
        i>0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i+1)
            );


        [
            a[i],
            a[j]
        ] =
        [
            a[j],
            a[i]
        ];

    }


    return a;

}

/* =========================================================
   EXAM QUESTION
========================================================= */

function examQuestionHTML(
    question,
    index
){

    const wrong = [];


    /*
      جواب‌های اشتباه از سایر لغات
    */

    const allWords =
        getIds()
        .flatMap(
            id =>
                lessons[id]?.vocab || []
        );


    const candidates =
        shuffle(
            allWords.filter(
                word =>
                    word.fa !== question.fa
            )
        );


    for(
        const candidate of candidates
    ){

        if(
            !wrong.includes(candidate.fa)
        ){

            wrong.push(
                candidate.fa
            );

        }

        if(wrong.length >= 3)
            break;

    }


    const options =
        shuffle([
            question.fa,
            ...wrong
        ]);


    return `

        <div class="question">

            <div class="question-number">
                سؤال ${index+1}
            </div>

            <div class="question-title">

                معنی عبارت زیر چیست؟

                <span class="question-title-en">

                    ${escapeHTML(question.en)}

                    <button
                        class="speak"
                        onclick="speak('${jsQuote(question.en)}')"
                        style="
                            width:34px;
                            height:34px;
                            margin-right:8px;
                        "
                    >
                        🔊
                    </button>

                </span>

            </div>


            <div class="options">

                ${
                    options
                    .map(
                        option => `

                            <button
                                class="option"
                                onclick="
                                    selectAnswer(
                                        ${index},
                                        this
                                    )
                                "
                                data-answer="${escapeHTML(option)}"
                            >
                                ${escapeHTML(option)}
                            </button>

                        `
                    )
                    .join("")
                }

            </div>

        </div>

    `;

}


/* =========================================================
   SELECT ANSWER
========================================================= */

function selectAnswer(
    index,
    element
){

    examAnswers[index] =
        element.dataset.answer;


    element
        .parentElement
        .querySelectorAll(".option")
        .forEach(
            btn =>
                btn.classList.remove(
                    "selected"
                )
        );


    element.classList.add(
        "selected"
    );

}


/* =========================================================
   SUBMIT EXAM
========================================================= */

function submitExam(endLesson){

    let correct = 0;


    for(
        let i=0;
        i<examQuestions.length;
        i++
    ){

        if(
            examAnswers[i] ===
            examQuestions[i].fa
        ){

            correct++;

        }

    }


    const total =
        examQuestions.length;


    const score =
        total
        ?
        Math.round(
            correct / total * 100
        )
        :
        0;


    if(score >= 70){

        let stars = 1;


        if(score >= 90)
            stars = 3;

        else if(score >= 80)
            stars = 2;


        progress[
            "exam_" + endLesson
        ] = {

            passed:true,

            score,

            stars

        };


        saveProgress();


        showExamResult(
            true,
            score,
            stars,
            endLesson
        );

    }
    else{

        showExamResult(
            false,
            score,
            0,
            endLesson
        );

    }

}

        "navSettings"
    );


    document.getElementById(
        "app"
    ).innerHTML = `

        <div class="section-title">

            <h2>
                ⚙️ تنظیمات
            </h2>

            <p>
                تنظیمات English Master
            </p>

        </div>


        <div class="setting">

            <div>

                <b>
                    🌙 حالت تاریک
                </b>

                <p>
                    تغییر ظاهر برنامه
                </p>

            </div>

            <button
                class="icon-btn"
                onclick="toggleTheme()"
            >
                ${
                    document.body.classList.contains("dark")
                    ?
                    "☀️"
                    :
                    "🌙"
                }
            </button>

        </div>


        <div class="setting">

            <div>

                <b>
                    🔊 سرعت خواندن انگلیسی
                </b>

                <p>
                    سرعت صدای متن‌های انگلیسی
                </p>

            </div>

            <div class="speed-buttons">

                ${speedButton(.7,"آهسته")}

                ${speedButton(.9,"عادی")}

                ${speedButton(1.1,"سریع")}

            </div>

        </div>


        <div class="setting">

            <div>

                <b>
                    📊 پیشرفت
                </b>

                <p>
                    ${completedCount()}
                    از
                    ${getIds().length}
                    درس
                </p>

            </div>

            <span>
                ${progressPercent()}٪
            </span>

        </div>


        <div class="content-card">

            <h3>
                🗑 پاک کردن پیشرفت
            </h3>

            <p style="
                color:var(--muted);
                line-height:2;
                margin-bottom:15px;
            ">
                تمام درس‌های کامل‌شده و نتایج آزمون‌ها
                حذف می‌شوند.
            </p>

            <button
                class="complete-btn"
                style="background:var(--red)"
                onclick="resetProgress()"
            >
                پاک کردن پیشرفت
            </button>

        </div>

    `;

}


/* =========================================================
   SPEED BUTTON
========================================================= */

function speedButton(
    value,
    title
){

    return `

        <button
            class="
                speed-btn
                ${speechRate === value ? "active" : ""}
            "
            onclick="setSpeechRate(${value})"
        >
            ${title}
        </button>

    `;

}


/* =========================================================
   SET SPEECH RATE
========================================================= */

function setSpeechRate(value){

    speechRate =
        Number(value);


    localStorage.setItem(
        "english_master_speech_rate",
        speechRate
    );


    showSettings();

}


/* =========================================================
   RESET
========================================================= */

function resetProgress(){

    if(
        !confirm(
            "آیا مطمئنی می‌خواهی تمام پیشرفت پاک شود؟"
        )
    )
        return;


    progress = {};


    saveProgress();


    toast(
        "✅ انجام شد",
        "پیشرفت پاک شد."
    );


    setTimeout(
        showHome,
        700
    );

}


/* =========================================================
   NAV
========================================================= */

function activeNav(id){

    document
        .querySelectorAll(".nav-btn")
        .forEach(
            btn =>
                btn.classList.remove(
                    "active"
                )
        );


    const button =
        document.getElementById(id);


    if(button){

        button.classList.add(
            "active"
        );

    }

}


/* =========================================================
   START
========================================================= */

loadTheme();

loadData();

</script>

</body>
</html>
